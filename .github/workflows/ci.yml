name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore
        run: dotnet restore Messager.NET.slnx
      - name: Build all projects
        run: dotnet build Messager.NET.slnx --configuration Release --no-restore -p:GeneratePackageOnBuild=false
      - name: Test all frameworks
        shell: bash
        run: |
          status=0
          for project in Tests/*/*.csproj; do
            name=$(basename "$project" .csproj)
            for framework in net10.0 net11.0; do
              dotnet test "$project" --configuration Release --no-build --framework "$framework" \
                --logger "trx;LogFileName=${name}-${framework}.trx" \
                --results-directory "$GITHUB_WORKSPACE/TestResults" || status=1
            done
          done
          exit "$status"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
